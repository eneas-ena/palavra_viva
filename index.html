<style>
:root{
  --navy:#0F1B33; --navy2:#1A2B4D; --navy3:#26395E;
  --ouro:#C9A227; --ouro-claro:#E8CE79;
  --papel:#F6F3EC; --branco:#FFF;
  --tinta:#17203A; --tinta2:#5C6478;
  --linha:rgba(255,255,255,.14);
  --maluco:#E0913A; --quem:#3FA98A; --ordem:#7E7BD4;
  --certo:#5DCAA5; --errado:#E07272;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--navy);min-height:100%}
body{font-family:Nunito,-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;padding:18px 16px 32px;min-height:100vh}
h1,h2,h3{font-family:Cinzel,serif;font-weight:600;margin:0}
.serif{font-family:"Cormorant Garamond",serif}

.topo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.topo h1{font-size:20px;letter-spacing:.03em;flex:1}
.topo h1 span{color:var(--ouro)}
.voltar{background:none;border:none;color:#93A0BC;font-size:26px;line-height:1;
  padding:4px 10px 8px;cursor:pointer;font-family:inherit}
.eu{font-size:13px;color:#93A0BC;display:flex;align-items:center;gap:7px;cursor:pointer}
.bolinha{width:26px;height:26px;border-radius:50%;background:var(--navy3);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ouro-claro)}

.cartao{background:var(--navy2);border:1px solid var(--linha);border-radius:16px;
  padding:16px 18px;margin-bottom:12px;width:100%;text-align:left;color:#fff;
  font-family:inherit;font-size:16px;cursor:pointer;display:block;transition:transform .12s}
.cartao:active{transform:scale(.985)}
.cartao.travado{opacity:.5;cursor:default}
.cartao .selo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;margin-bottom:12px}
.cartao b{display:block;font-size:17px;font-weight:700;margin-bottom:3px}
.cartao small{display:block;color:#A7B2CA;font-size:13px;line-height:1.45}
.estrelas{margin-top:10px;font-size:15px;color:var(--ouro);letter-spacing:2px}
.estrelas .off{color:#3D4869}

.jornadas{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--navy2);border:1px solid var(--linha);color:#A7B2CA;border-radius:20px;
  padding:7px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ouro);border-color:var(--ouro);color:#2A2205}
.verso{font-family:"Cormorant Garamond",serif;font-size:25px;line-height:1.6;
  background:var(--papel);color:var(--tinta);border-radius:14px;padding:18px 18px;margin-bottom:16px}
.ref{font-family:Nunito,sans-serif;font-size:12px;font-weight:700;color:var(--ouro);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:block}

.linhas{background:var(--papel);border-radius:14px;padding:14px;margin-bottom:14px;min-height:88px}
.linha{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:40px;
  border-bottom:2px dashed #D8D2C2;padding-bottom:6px;align-items:center}
.linha:last-child{border-bottom:none;margin-bottom:0}
.vaga{min-width:34px;height:36px;border-radius:8px;background:#EAE5D7}
.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.ficha{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;
  background:var(--branco);color:var(--tinta);border:none;border-radius:9px;
  padding:6px 13px;cursor:pointer;font-feature-settings:"liga";box-shadow:0 2px 0 #C9C2B0;
  transition:transform .1s}
.ficha:active{transform:translateY(2px);box-shadow:none}
.ficha.posta{background:#EFEADD;box-shadow:0 2px 0 #CFC7B2}
.ficha.presa{background:var(--ouro-claro);box-shadow:0 2px 0 #B99A2E;cursor:default}
.ficha.errou{background:#F6D3D3;box-shadow:0 2px 0 #D9A3A3}

.opcoes{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.opcao{background:var(--navy2);border:1px solid var(--linha);border-radius:12px;
  padding:14px 16px;color:#fff;font-family:inherit;font-size:16px;text-align:left;cursor:pointer}
.opcao.certa{background:#1D5E4B;border-color:var(--certo)}
.opcao.errada{background:#5E2626;border-color:var(--errado)}

.barra{display:flex;gap:10px;flex-wrap:wrap}
.bt{flex:1;min-width:120px;background:var(--ouro);color:#2A2205;border:none;border-radius:12px;
  padding:14px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.bt:active{transform:scale(.98)}
.bt.calmo{background:transparent;color:#A7B2CA;border:1px solid var(--linha)}
.campo{width:100%;padding:14px;border-radius:12px;border:1px solid var(--linha);
  background:var(--navy2);color:#fff;font-family:inherit;font-size:17px;margin-bottom:12px}
.campo::placeholder{color:#6B7794}

.dica{color:#93A0BC;font-size:13px;line-height:1.5;margin:0 0 14px}
.contexto{background:var(--navy2);border-left:3px solid var(--ouro);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:14px;line-height:1.55;color:#D6DCEA;margin-bottom:16px}
.contexto b{color:var(--ouro-claro)}
.aviso{background:#3A2E12;border:1px solid #6B5620;color:#E8CE79;border-radius:10px;
  padding:10px 13px;font-size:13px;margin-bottom:16px;line-height:1.5}
.progresso{font-size:13px;color:#93A0BC;margin-bottom:14px;display:flex;justify-content:space-between}
.fim{text-align:center;padding:24px 0}
.fim .grandes{font-size:40px;color:var(--ouro);letter-spacing:6px;margin:14px 0}
.fim h2{font-size:22px;margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const DEMO = [{"id":"vj-001","ref":"Lucas 1:38","texto":"Eis aqui a serva do Senhor; cumpra-se em mim segundo a tua palavra.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Maria","a_quem":"ao anjo Gabriel","contexto":"Em Nazaré, respondendo ao anúncio de que conceberia o Filho do Altíssimo.","distratores":{"facil":["Sara","Rute","Ester"],"medio":["Isabel","Ana, mãe de Samuel","Marta"],"dificil":["Isabel","Ana, a profetisa","Maria Madalena"]}},"lacunas":[{"pos":3,"categoria":"uma profissão","palavra":"serva"},{"pos":12,"categoria":"um objeto que existe na sua casa","palavra":"palavra"}],"blocos":["Eis aqui a serva do Senhor;","cumpra-se em mim segundo a tua palavra."]},{"id":"vj-002","ref":"Lucas 2:7","texto":"E deu à luz a seu filho primogênito, e envolveu-o em panos, e deitou-o numa manjedoura, porque não havia lugar para eles na estalagem.","dificuldade":3,"modos":["maluco","ordem"],"quem_disse":null,"lacunas":[{"pos":11,"categoria":"uma peça de roupa","palavra":"panos"},{"pos":15,"categoria":"um móvel","palavra":"manjedoura"},{"pos":23,"categoria":"um lugar da sua cidade","palavra":"estalagem"}],"blocos":["E deu à luz a seu filho primogênito,","e envolveu-o em panos,","e deitou-o numa manjedoura,","porque não havia lugar para eles na estalagem."]},{"id":"vj-003","ref":"Lucas 2:11","texto":"Pois, na cidade de Davi, vos nasceu hoje o Salvador, que é Cristo, o Senhor.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"O anjo do Senhor","a_quem":"aos pastores","contexto":"De noite, no campo, aos que guardavam os rebanhos perto de Belém.","distratores":{"facil":["Moisés","Davi","Elias"],"medio":["João Batista","Simeão","Zacarias"],"dificil":["Simeão","Ana, a profetisa","Zacarias"]}},"lacunas":[{"pos":2,"categoria":"um lugar","palavra":"cidade"},{"pos":7,"categoria":"um dia da semana","palavra":"hoje"}],"blocos":["Pois, na cidade de Davi,","vos nasceu hoje o Salvador,","que é Cristo, o Senhor."]},{"id":"vj-004","ref":"João 1:14","texto":"E o Verbo se fez carne, e habitou entre nós, e vimos a sua glória, como a glória do unigênito do Pai, cheio de graça e de verdade.","dificuldade":3,"modos":["maluco","ordem"],"quem_disse":null,"lacunas":[{"pos":7,"categoria":"um verbo no passado (ele ___)","palavra":"habitou"},{"pos":22,"categoria":"um adjetivo","palavra":"cheio"}],"blocos":["E o Verbo se fez carne,","e habitou entre nós,","e vimos a sua glória,","como a glória do unigênito do Pai,","cheio de graça e de verdade."]},{"id":"vj-005","ref":"João 1:29","texto":"Eis o Cordeiro de Deus, que tira o pecado do mundo.","dificuldade":1,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"João Batista","a_quem":"aos que estavam com ele","contexto":"Junto ao Jordão, ao ver Jesus vindo em sua direção.","distratores":{"facil":["Abraão","Josué","Salomão"],"medio":["Pedro","André","Filipe"],"dificil":["André","Natanael","João, o discípulo"]}},"lacunas":[{"pos":2,"categoria":"um animal","palavra":"Cordeiro"}],"blocos":["Eis o Cordeiro de Deus,","que tira o pecado do mundo."]},{"id":"vj-006","ref":"Mateus 3:17","texto":"Este é o meu Filho amado, em quem me comprazo.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"O Pai (voz dos céus)","a_quem":"publicamente, no batismo de Jesus","contexto":"No Jordão, quando o Espírito desceu como pomba sobre Jesus.","distratores":{"facil":["Moisés","Elias","Isaías"],"medio":["João Batista","Um anjo","Pedro"],"dificil":["João Batista","Um anjo do Senhor","O Espírito Santo"]}},"lacunas":[{"pos":5,"categoria":"um adjetivo","palavra":"amado"}],"blocos":["Este é o meu Filho amado,","em quem me comprazo."]},{"id":"vj-007","ref":"Mateus 4:4","texto":"Nem só de pão viverá o homem, mas de toda a palavra que sai da boca de Deus.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"ao tentador","contexto":"No deserto, após quarenta dias de jejum, respondendo à primeira tentação.","distratores":{"facil":["Moisés","Davi","Jonas"],"medio":["Paulo","Pedro","João Batista"],"dificil":["Moisés","João Batista","O tentador"]}},"lacunas":[{"pos":3,"categoria":"uma comida","palavra":"pão"},{"pos":15,"categoria":"uma parte do corpo","palavra":"boca"}],"blocos":["Nem só de pão viverá o homem,","mas de toda a palavra","que sai da boca de Deus."]},{"id":"vj-008","ref":"Mateus 4:19","texto":"Vinde após mim, e eu vos farei pescadores de homens.","dificuldade":1,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"a Pedro e André","contexto":"À beira do mar da Galileia, chamando dois irmãos que lançavam a rede.","distratores":{"facil":["Noé","Abraão","Salomão"],"medio":["Pedro","Paulo","João Batista"],"dificil":["Pedro","André","Tiago"]}},"lacunas":[{"pos":7,"categoria":"uma profissão no plural","palavra":"pescadores"}],"blocos":["Vinde após mim,","e eu vos farei pescadores de homens."]},{"id":"vj-009","ref":"Mateus 5:14","texto":"Vós sois a luz do mundo; não se pode esconder uma cidade edificada sobre um monte.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos discípulos e à multidão","contexto":"No Sermão do Monte, logo depois das bem-aventuranças.","distratores":{"facil":["Davi","Salomão","Daniel"],"medio":["Paulo","Pedro","Tiago"],"dificil":["Paulo","João, o discípulo","Isaías"]}},"lacunas":[{"pos":3,"categoria":"algo que ilumina","palavra":"luz"},{"pos":15,"categoria":"um lugar alto","palavra":"monte"}],"blocos":["Vós sois a luz do mundo;","não se pode esconder uma cidade","edificada sobre um monte."]},{"id":"vj-010","ref":"Mateus 6:33","texto":"Mas buscai primeiro o reino de Deus, e a sua justiça, e todas estas coisas vos serão acrescentadas.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos discípulos e à multidão","contexto":"No Sermão do Monte, ensinando a não andar ansioso pelo dia de amanhã.","distratores":{"facil":["Salomão","Jó","Josué"],"medio":["Paulo","Tiago","Pedro"],"dificil":["Tiago","Paulo","João Batista"]}},"lacunas":[{"pos":2,"categoria":"um número ordinal (primeiro, quinto...)","palavra":"primeiro"},{"pos":10,"categoria":"uma qualidade","palavra":"justiça"}],"blocos":["Mas buscai primeiro o reino de Deus,","e a sua justiça,","e todas estas coisas vos serão acrescentadas."]},{"id":"vj-011","ref":"Mateus 7:7","texto":"Pedi, e dar-se-vos-á; buscai, e encontrareis; batei, e abrir-se-vos-á.","dificuldade":3,"modos":["quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos discípulos e à multidão","contexto":"No Sermão do Monte, ensinando sobre a oração persistente.","distratores":{"facil":["Davi","Elias","Moisés"],"medio":["Tiago","Paulo","Pedro"],"dificil":["Tiago","João, o discípulo","Paulo"]}},"lacunas":[],"blocos":["Pedi, e dar-se-vos-á;","buscai, e encontrareis;","batei, e abrir-se-vos-á."]},{"id":"vj-012","ref":"Mateus 8:8","texto":"Senhor, não sou digno de que entres debaixo do meu telhado, mas dize somente uma palavra, e o meu criado sarará.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"O centurião","a_quem":"a Jesus","contexto":"Em Cafarnaum, pedindo cura para o seu servo paralítico.","distratores":{"facil":["Moisés","Davi","Daniel"],"medio":["Pedro","Jairo","Zaqueu"],"dificil":["Jairo","Zaqueu","O nobre de Cafarnaum"]}},"lacunas":[{"pos":10,"categoria":"uma parte da casa","palavra":"telhado"},{"pos":19,"categoria":"uma pessoa da família","palavra":"criado"}],"blocos":["Senhor, não sou digno","de que entres debaixo do meu telhado,","mas dize somente uma palavra,","e o meu criado sarará."]},{"id":"vj-013","ref":"Marcos 4:39","texto":"Cala-te, aquieta-te.","dificuldade":1,"modos":["quem"],"quem_disse":{"personagem":"Jesus","a_quem":"ao vento e ao mar","contexto":"Numa barca, durante a grande tempestade no mar da Galileia.","distratores":{"facil":["Jonas","Noé","Elias"],"medio":["Pedro","Paulo","Moisés"],"dificil":["Pedro","Elias","Moisés"]}},"lacunas":[],"blocos":[]},{"id":"vj-014","ref":"Mateus 11:28","texto":"Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei.","dificuldade":1,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"à multidão","contexto":"Depois de repreender as cidades que não se arrependeram.","distratores":{"facil":["Davi","Moisés","Josué"],"medio":["Paulo","Pedro","Isaías"],"dificil":["Isaías","Paulo","João Batista"]}},"lacunas":[{"pos":7,"categoria":"um adjetivo no plural","palavra":"cansados"}],"blocos":["Vinde a mim,","todos os que estais cansados e oprimidos,","e eu vos aliviarei."]},{"id":"vj-015","ref":"Mateus 14:25","texto":"E, à quarta vigília da noite, dirigiu-se Jesus para eles, andando por cima do mar.","dificuldade":2,"modos":["maluco","ordem"],"quem_disse":null,"lacunas":[{"pos":5,"categoria":"um período do dia","palavra":"noite"},{"pos":14,"categoria":"um lugar com água","palavra":"mar"}],"blocos":["E, à quarta vigília da noite,","dirigiu-se Jesus para eles,","andando por cima do mar."]},{"id":"vj-016","ref":"Mateus 16:16","texto":"Tu és o Cristo, o Filho do Deus vivo.","dificuldade":1,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Pedro","a_quem":"a Jesus","contexto":"Em Cesareia de Filipe, respondendo à pergunta sobre quem os discípulos diziam que ele era.","distratores":{"facil":["Moisés","Davi","Abraão"],"medio":["João Batista","Paulo","Tomé"],"dificil":["Tomé","André","João, o discípulo"]}},"lacunas":[{"pos":8,"categoria":"um adjetivo","palavra":"vivo"}],"blocos":["Tu és o Cristo,","o Filho do Deus vivo."]},{"id":"vj-017","ref":"João 6:35","texto":"Eu sou o pão da vida; aquele que vem a mim não terá fome, e quem crê em mim nunca terá sede.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"à multidão em Cafarnaum","contexto":"No dia seguinte à multiplicação dos pães, quando o povo o procurou de novo.","distratores":{"facil":["Moisés","Elias","Davi"],"medio":["Paulo","Pedro","João Batista"],"dificil":["Moisés","Paulo","Pedro"]}},"lacunas":[{"pos":3,"categoria":"uma comida","palavra":"pão"},{"pos":13,"categoria":"uma sensação","palavra":"fome"}],"blocos":["Eu sou o pão da vida;","aquele que vem a mim não terá fome,","e quem crê em mim nunca terá sede."]},{"id":"vj-018","ref":"João 8:12","texto":"Eu sou a luz do mundo; quem me segue não andará em trevas, mas terá a luz da vida.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos fariseus e ao povo","contexto":"No templo, junto à arca do tesouro, durante a festa dos tabernáculos.","distratores":{"facil":["Salomão","Isaías","Daniel"],"medio":["Paulo","João Batista","Pedro"],"dificil":["João Batista","Paulo","Isaías"]}},"lacunas":[{"pos":12,"categoria":"algo escuro","palavra":"trevas"}],"blocos":["Eu sou a luz do mundo;","quem me segue não andará em trevas,","mas terá a luz da vida."]},{"id":"vj-019","ref":"Marcos 9:24","texto":"Eu creio, Senhor! Ajuda a minha incredulidade.","dificuldade":2,"modos":["quem","ordem"],"quem_disse":{"personagem":"O pai do menino endemoninhado","a_quem":"a Jesus","contexto":"Ao pé do monte da transfiguração, depois que os discípulos não conseguiram curar o filho.","distratores":{"facil":["Davi","Jó","Moisés"],"medio":["Pedro","Tomé","Jairo"],"dificil":["Jairo","Tomé","O centurião"]}},"lacunas":[],"blocos":["Eu creio, Senhor!","Ajuda a minha incredulidade."]},{"id":"vj-020","ref":"Marcos 10:14","texto":"Deixai vir os meninos a mim, e não os impeçais, porque dos tais é o reino de Deus.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos discípulos","contexto":"Quando os discípulos repreenderam os que traziam crianças para que ele as tocasse.","distratores":{"facil":["Moisés","Samuel","Davi"],"medio":["Pedro","Paulo","Tiago"],"dificil":["Pedro","Paulo","André"]}},"lacunas":[{"pos":3,"categoria":"um grupo de pessoas no plural","palavra":"meninos"}],"blocos":["Deixai vir os meninos a mim,","e não os impeçais,","porque dos tais é o reino de Deus."]},{"id":"vj-021","ref":"Lucas 19:5","texto":"Zaqueu, desce depressa, porque hoje me convém pousar em tua casa.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"a Zaqueu","contexto":"Em Jericó, olhando para cima, para o homem que subira num sicômoro.","distratores":{"facil":["Elias","Samuel","Josué"],"medio":["Pedro","João Batista","Paulo"],"dificil":["Pedro","Um dos publicanos","Um dos fariseus"]}},"lacunas":[{"pos":2,"categoria":"um advérbio de modo","palavra":"depressa"},{"pos":10,"categoria":"um lugar","palavra":"casa"}],"blocos":["Zaqueu, desce depressa,","porque hoje me convém pousar em tua casa."]},{"id":"vj-022","ref":"João 13:34","texto":"Um novo mandamento vos dou: Que vos ameis uns aos outros; como eu vos amei a vós, que também vós uns aos outros vos ameis.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos discípulos","contexto":"No cenáculo, depois de lavar-lhes os pés e de Judas ter saído.","distratores":{"facil":["Moisés","Davi","Salomão"],"medio":["Paulo","Pedro","João, o discípulo"],"dificil":["João, o discípulo","Paulo","Pedro"]}},"lacunas":[{"pos":1,"categoria":"um adjetivo","palavra":"novo"}],"blocos":["Um novo mandamento vos dou:","Que vos ameis uns aos outros;","como eu vos amei a vós,","que também vós uns aos outros vos ameis."]},{"id":"vj-023","ref":"João 14:6","texto":"Eu sou o caminho, e a verdade, e a vida; ninguém vem ao Pai, senão por mim.","dificuldade":1,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"a Tomé","contexto":"No cenáculo, respondendo a quem disse não saber para onde ele ia.","distratores":{"facil":["Moisés","Davi","Elias"],"medio":["Pedro","Paulo","João Batista"],"dificil":["Tomé","Filipe","Pedro"]}},"lacunas":[{"pos":3,"categoria":"um lugar por onde se anda","palavra":"caminho"}],"blocos":["Eu sou o caminho,","e a verdade, e a vida;","ninguém vem ao Pai, senão por mim."]},{"id":"vj-024","ref":"João 3:16","texto":"Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"a Nicodemos","contexto":"De noite, conversando com um principal dos judeus sobre o novo nascimento.","distratores":{"facil":["Moisés","Davi","Isaías"],"medio":["Paulo","Pedro","João Batista"],"dificil":["Nicodemos","João Batista","Paulo"]}},"lacunas":[{"pos":2,"categoria":"um verbo no passado (ele ___)","palavra":"amou"},{"pos":4,"categoria":"um lugar","palavra":"mundo"},{"pos":27,"categoria":"um adjetivo feminino","palavra":"eterna"}],"blocos":["Porque Deus amou o mundo de tal maneira","que deu o seu Filho unigênito,","para que todo aquele que nele crê não pereça,","mas tenha a vida eterna."]},{"id":"vj-025","ref":"Lucas 22:42","texto":"Pai, se queres, passa de mim este cálice; todavia não se faça a minha vontade, mas a tua.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"ao Pai","contexto":"No monte das Oliveiras, ajoelhado em oração, pouco antes da prisão.","distratores":{"facil":["Davi","Jó","Jonas"],"medio":["Pedro","Paulo","Estêvão"],"dificil":["Estêvão","Pedro","Paulo"]}},"lacunas":[{"pos":7,"categoria":"um objeto da cozinha","palavra":"cálice"}],"blocos":["Pai, se queres,","passa de mim este cálice;","todavia não se faça a minha vontade,","mas a tua."]},{"id":"vj-026","ref":"Mateus 26:41","texto":"Vigiai e orai, para que não entreis em tentação; na verdade, o espírito está pronto, mas a carne é fraca.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"a Pedro, Tiago e João","contexto":"No Getsêmani, ao encontrá-los dormindo pela primeira vez.","distratores":{"facil":["Davi","Salomão","Daniel"],"medio":["Paulo","Pedro","Tiago"],"dificil":["Paulo","Pedro","João, o discípulo"]}},"lacunas":[{"pos":19,"categoria":"um adjetivo feminino","palavra":"fraca"}],"blocos":["Vigiai e orai,","para que não entreis em tentação;","na verdade, o espírito está pronto,","mas a carne é fraca."]},{"id":"vj-027","ref":"Lucas 23:34","texto":"Pai, perdoa-lhes, porque não sabem o que fazem.","dificuldade":1,"modos":["quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"ao Pai","contexto":"Na cruz, enquanto os soldados repartiam as suas vestes.","distratores":{"facil":["Davi","Moisés","José do Egito"],"medio":["Estêvão","Pedro","Paulo"],"dificil":["Estêvão","O ladrão da cruz","O centurião"]}},"lacunas":[],"blocos":["Pai, perdoa-lhes,","porque não sabem o que fazem."]},{"id":"vj-028","ref":"Mateus 28:6","texto":"Ele não está aqui, porque já ressuscitou, como havia dito. Vinde, vede o lugar onde o Senhor jazia.","dificuldade":2,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"O anjo do Senhor","a_quem":"às mulheres, no sepulcro","contexto":"Na madrugada do primeiro dia da semana, sentado sobre a pedra removida.","distratores":{"facil":["Moisés","Elias","Davi"],"medio":["Pedro","João, o discípulo","Maria Madalena"],"dificil":["Maria Madalena","Pedro","José de Arimateia"]}},"lacunas":[{"pos":13,"categoria":"um lugar","palavra":"lugar"}],"blocos":["Ele não está aqui,","porque já ressuscitou, como havia dito.","Vinde, vede o lugar onde o Senhor jazia."]},{"id":"vj-029","ref":"João 20:28","texto":"Senhor meu, e Deus meu!","dificuldade":1,"modos":["quem"],"quem_disse":{"personagem":"Tomé","a_quem":"a Jesus","contexto":"Oito dias depois da ressurreição, ao ver as marcas dos cravos.","distratores":{"facil":["Moisés","Davi","Abraão"],"medio":["Pedro","João Batista","Paulo"],"dificil":["Pedro","Natanael","João, o discípulo"]}},"lacunas":[],"blocos":[]},{"id":"vj-030","ref":"Mateus 28:19","texto":"Portanto ide, fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do Espírito Santo.","dificuldade":3,"modos":["maluco","quem","ordem"],"quem_disse":{"personagem":"Jesus","a_quem":"aos onze discípulos","contexto":"Num monte da Galileia, depois da ressurreição.","distratores":{"facil":["Moisés","Josué","Elias"],"medio":["Paulo","Pedro","Tiago"],"dificil":["Pedro","Paulo","Um anjo"]}},"lacunas":[{"pos":7,"categoria":"um grupo no plural","palavra":"nações"}],"blocos":["Portanto ide,","fazei discípulos de todas as nações,","batizando-os em nome do Pai,","e do Filho, e do Espírito Santo."]}];
</script>
<script>
const $ = s => document.querySelector(s);
const app = $("#app");
let versiculos = [], demo = false, perfil = null, progresso = {}, jornadaAtual = null;

/* ---------- utilidades ---------- */
const PONT = `.,;:!?"“”‘’()—`;
const limpo = p => { let a=0,b=p.length; while(a<b&&PONT.includes(p[a]))a++; while(b>a&&PONT.includes(p[b-1]))b--; return p.slice(a,b); };
function baralho(a) {
  const c = a.slice();
  for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
  return c;
}
function baralhoDiferente(a) {
  if (a.length < 2) return a.slice();
  let c, n = 0;
  do { c = baralho(a); n++; } while (n < 12 && c.every((x, i) => x === a[i]));
  return c;
}
const chave = () => `pv_${perfil}`;
function salvar() { try { localStorage.setItem(chave(), JSON.stringify(progresso)); } catch (e) {} }
function carregar() { try { progresso = JSON.parse(localStorage.getItem(chave()) || "{}"); } catch (e) { progresso = {}; } }

/* ---------- som e toque ---------- */
let ctx = null;
function bip(freq, dur) {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.09, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
const somCerto = () => { bip(660, .12); setTimeout(() => bip(880, .16), 90); if (navigator.vibrate) navigator.vibrate(18); };
const somErro  = () => { bip(180, .18); if (navigator.vibrate) navigator.vibrate([12, 60, 12]); };

/* ---------- dados ---------- */
async function buscarVersiculos() {
  if (!CFG.URL || !CFG.KEY) { demo = true; return comJornada(DEMO); }
  try {
    const r = await fetch(`${CFG.URL}/rest/v1/pv_jogo?select=*`,
      { headers: { apikey: CFG.KEY, Authorization: "Bearer " + CFG.KEY } });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.length) throw new Error("vazio");
    return d;
  } catch (e) { demo = true; return comJornada(DEMO); }
}

const comJornada = lst => lst.map(v => ({ ...v, jornada_id: "vida-de-jesus", jornada: "Vida de Jesus" }));

/* ---------- telas ---------- */
function topo(titulo, voltarPara) {
  return `<div class="topo">
    ${voltarPara ? `<button class="voltar" onclick="${voltarPara}" aria-label="Voltar">‹</button>` : ""}
    <h1>${titulo}</h1>
    ${perfil ? `<div class="eu" onclick="telaPerfis()"><span class="bolinha">${perfil[0].toUpperCase()}</span>${perfil}</div>` : ""}
  </div>`;
}

function telaPerfis() {
  let nomes = [];
  try { nomes = JSON.parse(localStorage.getItem("pv_perfis") || "[]"); } catch (e) {}
  app.innerHTML = `<div class="topo"><h1>Palavra <span>Viva</span></h1></div>
    <p class="dica">Quem vai jogar agora?</p>
    ${nomes.map(n => `<button class="cartao" onclick="entrar('${n.replace(/'/g, "\\'")}')">
        <b>${n}</b><small>continuar de onde parou</small></button>`).join("")}
    <input class="campo" id="novoNome" placeholder="Escrever um nome novo" maxlength="14">
    <div class="barra"><button class="bt" onclick="criarPerfil()">Começar</button></div>`;
}
function criarPerfil() {
  const n = $("#novoNome").value.trim();
  if (!n) return;
  let nomes = [];
  try { nomes = JSON.parse(localStorage.getItem("pv_perfis") || "[]"); } catch (e) {}
  if (!nomes.includes(n)) nomes.push(n);
  localStorage.setItem("pv_perfis", JSON.stringify(nomes));
  entrar(n);
}
function entrar(n) { perfil = n; carregar(); telaInicio(); }

const MODOS = [
  { id: "maluco", nome: "Versículo maluco", sub: "Complete às cegas e ria do resultado", cor: "var(--maluco)", sinal: "✎" },
  { id: "quem",   nome: "Quem disse?",      sub: "Descubra a voz por trás da frase",     cor: "var(--quem)",   sinal: "?" },
  { id: "ordem",  nome: "Palavras em ordem",sub: "Reconstrua o versículo, palavra a palavra", cor: "var(--ordem)", sinal: "⁙" }
];

const chaveModo = modo => modo === "quem" ? "quem" : `${jornadaAtual}:${modo}`;

function estrelasDe(modo) {
  const e = progresso[chaveModo(modo)]?.estrelas || 0;
  return `<div class="estrelas">${"★".repeat(e)}<span class="off">${"★".repeat(Math.max(0, 3 - e))}</span></div>`;
}

function jornadasDisponiveis() {
  const m = new Map();
  versiculos.forEach(v => { if (!m.has(v.jornada_id)) m.set(v.jornada_id, v.jornada || v.jornada_id); });
  return [...m.entries()].map(([id, nome]) => ({ id, nome }));
}

function poolDe(modo) {
  // Quem disse ignora a jornada de propósito: sorteando do acervo inteiro,
  // o jogador não decora o autor da jornada em que está.
  const base = modo === "quem" ? versiculos : versiculos.filter(v => v.jornada_id === jornadaAtual);
  return base.filter(v => v.modos.includes(modo));
}

function telaInicio() {
  const js = jornadasDisponiveis();
  if (!jornadaAtual || !js.some(j => j.id === jornadaAtual)) jornadaAtual = js.length ? js[0].id : null;
  const nomeJ = (js.find(j => j.id === jornadaAtual) || {}).nome || "";

  app.innerHTML = topo("Palavra <span>Viva</span>") +
    (demo ? `<div class="aviso">${(!CFG.URL || !CFG.KEY)
        ? "Jogando com os 30 versículos embutidos. Para usar o banco, preencha URL e KEY no início do arquivo."
        : "Jogando com os versículos guardados no aparelho — o banco não respondeu agora."}</div>` : "") +
    (js.length > 1 ? `<div class="jornadas">${js.map(j =>
        `<button class="chip ${j.id === jornadaAtual ? "on" : ""}" onclick="trocarJornada('${j.id}')">${j.nome}</button>`).join("")}</div>`
      : `<p class="dica">Jornada: ${nomeJ}</p>`) +
    MODOS.map(m => {
      const n = poolDe(m.id).length;
      const tudo = m.id === "quem";
      return `<button class="cartao ${n ? "" : "travado"}" ${n ? `onclick="comecar('${m.id}')"` : ""}>
        <div class="selo" style="background:${m.cor}">${m.sinal}</div>
        <b>${m.nome}</b><small>${m.sub} · ${n} versículo${n === 1 ? "" : "s"}${tudo ? ", de todas as jornadas" : ""}</small>
        ${estrelasDe(m.id)}
      </button>`;
    }).join("") +
    `<p class="dica" style="margin-top:18px">Versículos aprendidos: ${(progresso.aprendidos || []).length}</p>`;
}

function trocarJornada(id) { jornadaAtual = id; telaInicio(); }

/* ---------- motor da partida ---------- */
let jogo = null;

function comecar(modo) {
  const pool = poolDe(modo);
  if (!pool.length) { app.innerHTML = topo("", "telaInicio()") + `<p class="dica">Nenhum versículo disponível para este modo ainda.</p>`; return; }
  let fila = baralho(pool).slice(0, 5);
  if (modo === "quem") fila = espalharPersonagens(fila);
  jogo = { modo, fila, i: 0, pontos: 0, dicas: 0 };
  rodada();
}

/* evita duas perguntas seguidas com o mesmo personagem */
function espalharPersonagens(fila) {
  for (let i = 1; i < fila.length; i++) {
    if (fila[i].quem_disse?.personagem === fila[i - 1].quem_disse?.personagem) {
      const j = fila.findIndex((v, k) => k > i && v.quem_disse?.personagem !== fila[i - 1].quem_disse?.personagem);
      if (j > 0) [fila[i], fila[j]] = [fila[j], fila[i]];
    }
  }
  return fila;
}

function rodada() {
  if (jogo.i >= jogo.fila.length) return telaFim();
  const v = jogo.fila[jogo.i];
  if (jogo.modo === "ordem") return jogoOrdem(v);
  if (jogo.modo === "quem") return jogoQuem(v);
  return jogoMaluco(v);
}

function cabecalhoRodada() {
  const m = MODOS.find(x => x.id === jogo.modo);
  return topo(m.nome, "telaInicio()") +
    `<div class="progresso"><span>Versículo ${jogo.i + 1} de ${jogo.fila.length}</span><span>${jogo.pontos} ponto(s)</span></div>`;
}

function proxima(ganhou) {
  if (ganhou) {
    jogo.pontos++;
    const v = jogo.fila[jogo.i];
    progresso.aprendidos = progresso.aprendidos || [];
    if (!progresso.aprendidos.includes(v.id)) progresso.aprendidos.push(v.id);
    salvar();
  }
  jogo.i++;
  rodada();
}

/* ---------- 1. PALAVRAS EM ORDEM ---------- */
function jogoOrdem(v) {
  const blocos = (v.blocos && v.blocos.length) ? v.blocos : [v.texto];
  const alvo = blocos.map(b => b.split(" "));
  const presas = alvo.map(l => l.map(() => null));
  const banco = baralhoDiferente(alvo.flat().map((p, i) => ({ p, i })));
  let usadas = new Set(), dicaUsada = false, tentativas = 0;

  function posicaoGlobal(li, ci) { let n = 0; for (let k = 0; k < li; k++) n += alvo[k].length; return n + ci; }

  function pintar() {
    app.innerHTML = cabecalhoRodada() +
      `<span class="ref">${v.ref}</span>
       <div class="linhas">${alvo.map((linha, li) => `<div class="linha">${
          linha.map((_, ci) => {
            const g = presas[li][ci];
            return g === null ? `<span class="vaga"></span>`
              : `<button class="ficha ${g.travada ? "presa" : "posta"}" ${g.travada ? "" : `onclick="devolver(${li},${ci})"`}>${g.p}</button>`;
          }).join("")}</div>`).join("")}</div>
       <div class="banco">${banco.map((f, k) =>
          usadas.has(k) ? "" : `<button class="ficha" onclick="colocar(${k})">${f.p}</button>`).join("")}</div>
       <div class="barra">
         <button class="bt calmo" onclick="dicaOrdem()">Dica</button>
         <button class="bt" onclick="conferirOrdem()">Conferir</button>
       </div>`;
  }

  window.colocar = k => {
    for (let li = 0; li < alvo.length; li++) for (let ci = 0; ci < alvo[li].length; ci++) {
      if (presas[li][ci] === null) {
        presas[li][ci] = { p: banco[k].p, k, travada: false };
        usadas.add(k); bip(520, .06); return pintar();
      }
    }
  };
  window.devolver = (li, ci) => { const g = presas[li][ci]; if (!g || g.travada) return; usadas.delete(g.k); presas[li][ci] = null; pintar(); };

  window.dicaOrdem = () => {
    dicaUsada = true;
    for (let li = 0; li < alvo.length; li++) for (let ci = 0; ci < alvo[li].length; ci++) {
      if (presas[li][ci] === null || presas[li][ci].p !== alvo[li][ci]) {
        if (presas[li][ci]) { usadas.delete(presas[li][ci].k); }
        const k = banco.findIndex((f, idx) => f.p === alvo[li][ci] && !usadas.has(idx));
        if (k < 0) return;
        presas[li][ci] = { p: banco[k].p, k, travada: true };
        usadas.add(k); bip(760, .1); return pintar();
      }
    }
  };

  window.conferirOrdem = () => {
    if (presas.flat().some(g => g === null)) { return sacudir(); }
    tentativas++;
    let tudoCerto = true;
    presas.forEach((linha, li) => linha.forEach((g, ci) => {
      if (g.p === alvo[li][ci]) g.travada = true;
      else { tudoCerto = false; usadas.delete(g.k); presas[li][ci] = null; }
    }));
    if (tudoCerto) { somCerto(); return telaAcerto(v, !dicaUsada && tentativas === 1); }
    somErro(); pintar();
  };

  function sacudir() { const el = document.querySelector(".linhas"); el.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], 220); }
  pintar();
}

/* ---------- 2. QUEM DISSE ---------- */
function jogoQuem(v) {
  const nivel = v.dificuldade === 1 ? "facil" : v.dificuldade === 2 ? "medio" : "dificil";
  const certo = v.quem_disse.personagem;
  const opcoes = baralho([certo, ...(v.quem_disse.distratores[nivel] || [])]);
  app.innerHTML = cabecalhoRodada() +
    `<div class="verso serif">${v.texto}</div>
     <p class="dica">Quem falou estas palavras?</p>
     <div class="opcoes">${opcoes.map((o, k) =>
        `<button class="opcao" id="op${k}" onclick="responder(${k})">${o}</button>`).join("")}</div>`;
  window.responder = k => {
    const acertou = opcoes[k] === certo;
    opcoes.forEach((o, j) => {
      const el = document.getElementById("op" + j);
      el.onclick = null;
      if (o === certo) el.className = "opcao certa";
      else if (j === k) el.className = "opcao errada";
    });
    acertou ? somCerto() : somErro();
    setTimeout(() => telaContexto(v, acertou), 700);
  };
}

function telaContexto(v, acertou) {
  const q = v.quem_disse;
  app.innerHTML = cabecalhoRodada() +
    `<div class="verso serif">${v.texto}<br><span class="ref" style="margin-top:12px">${v.ref}</span></div>
     <div class="contexto"><b>${q.personagem}</b>${q.a_quem ? ", " + q.a_quem : ""}.<br>${q.contexto || ""}</div>
     <div class="barra"><button class="bt" onclick="proxima(${acertou})">Continuar</button></div>`;
}

/* ---------- 3. VERSÍCULO MALUCO ---------- */
function jogoMaluco(v) {
  const lac = v.lacunas.slice().sort((a, b) => a.pos - b.pos);
  const dadas = [];
  let etapa = 0;

  function perguntar() {
    if (etapa >= lac.length) return mostrarMaluco();
    app.innerHTML = cabecalhoRodada() +
      `<p class="dica">Sem espiar o versículo! Escreva ${lac.length} palavras e veja no que dá.</p>
       <div class="cartao" style="cursor:default"><b>${etapa + 1}ª palavra</b>
         <small>Escreva ${lac[etapa].categoria}</small></div>
       <input class="campo" id="pal" maxlength="22" autocomplete="off" placeholder="sua palavra">
       <div class="barra"><button class="bt" onclick="enviarPalavra()">Pronto</button></div>`;
    const c = $("#pal");
    c.focus();
    c.onkeydown = e => { if (e.key === "Enter") enviarPalavra(); };
  }
  window.enviarPalavra = () => {
    const p = $("#pal").value.trim();
    if (!p) return $("#pal").focus();
    dadas.push(p); etapa++; bip(600, .07); perguntar();
  };

  function versaoCom(trocas) {
    const pal = v.texto.split(" ");
    lac.forEach((l, i) => {
      if (trocas[i] === undefined) return;
      const orig = pal[l.pos];
      const cauda = orig.slice(limpo(orig).length);
      pal[l.pos] = trocas[i] + cauda;
    });
    return pal.join(" ");
  }

  function mostrarMaluco() {
    app.innerHTML = cabecalhoRodada() +
      `<span class="ref">${v.ref} — versão maluca</span>
       <div class="verso serif" id="alvo">${versaoCom(dadas)}</div>
       <div class="barra"><button class="bt" onclick="revelar()">Ver como é de verdade</button></div>`;
  }

  window.revelar = () => {
    let i = 0;
    const passo = () => {
      const parcial = dadas.slice();
      for (let k = 0; k <= i && k < lac.length; k++) parcial[k] = limpo(v.texto.split(" ")[lac[k].pos]);
      $("#alvo").innerHTML = versaoCom(parcial);
      bip(700 + i * 60, .1);
      i++;
      if (i <= lac.length) setTimeout(passo, 620); else setTimeout(fixar, 700);
    };
    $(".barra").innerHTML = "";
    passo();
  };

  function fixar() {
    const alvoPal = lac.map(l => limpo(v.texto.split(" ")[l.pos]));
    let k = 0, erros = 0;
    const perguntaFixa = () => {
      if (k >= lac.length) return telaAcerto(v, erros === 0);
      const outras = v.texto.split(" ").map(limpo).filter(p => p.length > 3 && p !== alvoPal[k]);
      const ops = baralho([alvoPal[k], ...baralho(outras).slice(0, 2)]);
      app.innerHTML = cabecalhoRodada() +
        `<span class="ref">${v.ref}</span>
         <div class="verso serif">${v.texto.split(" ").map((p, idx) =>
            idx === lac[k].pos ? `<b style="color:#8A6D1F">______</b>` : p).join(" ")}</div>
         <p class="dica">Qual era a palavra certa?</p>
         <div class="opcoes">${ops.map((o, j) =>
            `<button class="opcao" id="fx${j}" onclick="fixarResp(${j})">${o}</button>`).join("")}</div>`;
      window.fixarResp = j => {
        const ok = ops[j] === alvoPal[k];
        if (!ok) erros++;
        ops.forEach((o, z) => {
          const el = document.getElementById("fx" + z); el.onclick = null;
          if (o === alvoPal[k]) el.className = "opcao certa"; else if (z === j) el.className = "opcao errada";
        });
        ok ? somCerto() : somErro();
        k++; setTimeout(perguntaFixa, 800);
      };
    };
    perguntaFixa();
  }

  perguntar();
}

/* ---------- fim de rodada ---------- */
function telaAcerto(v, semAjuda) {
  app.innerHTML = cabecalhoRodada() +
    `<div class="fim"><h2>${semAjuda ? "De primeira!" : "Chegou lá."}</h2>
      <div class="verso serif" style="text-align:left;margin-top:16px">
        <span class="ref">${v.ref}</span>${v.texto}</div>
      <div class="barra"><button class="bt" onclick="proxima(true)">Continuar</button></div></div>`;
}

function telaFim() {
  const e = jogo.pontos >= 5 ? 3 : jogo.pontos >= 4 ? 2 : jogo.pontos >= 2 ? 1 : 0;
  const k = chaveModo(jogo.modo);
  const ant = progresso[k]?.estrelas || 0;
  progresso[k] = { estrelas: Math.max(ant, e) };
  salvar();
  app.innerHTML = topo("Fim da rodada", "telaInicio()") +
    `<div class="fim">
      <div class="grandes">${"★".repeat(e)}<span style="color:#3D4869">${"★".repeat(3 - e)}</span></div>
      <h2>${jogo.pontos} de ${jogo.fila.length}</h2>
      <p class="dica">${e === 3 ? "Rodada perfeita." : "Jogue de novo para melhorar."}</p>
      <div class="barra" style="margin-top:20px">
        <button class="bt calmo" onclick="telaInicio()">Voltar</button>
        <button class="bt" onclick="comecar('${jogo.modo}')">Jogar outra</button>
      </div></div>`;
}

/* ---------- partida ---------- */
(async function () {
  app.innerHTML = `<div class="topo"><h1>Palavra <span>Viva</span></h1></div><p class="dica">Abrindo…</p>`;
  versiculos = await buscarVersiculos();
  telaPerfis();
})();
